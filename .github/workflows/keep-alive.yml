name: Keep Render server alive

on:
  schedule:
    # Toutes les 13 minutes (marge sous les 15 min de mise en veille de Render free tier)
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bacot-corpus
        run: |
          curl -sS -o /dev/null -w "Status: %{http_code}\n" https://corpus-bacot.onrender.com/
